[pytest]
testpaths = tests
# Repo root on the path so tests/ha can import custom_components.tariff_tracker.
pythonpath = .
# tests/ha runs against a real Home Assistant (pytest-homeassistant-custom-component,
# which brings pytest-asyncio). Without it installed the option is unknown, and
# tests/conftest.py skips that directory.
asyncio_mode = auto
filterwarnings =
    ignore:Unknown config option. asyncio_mode:pytest.PytestConfigWarning
